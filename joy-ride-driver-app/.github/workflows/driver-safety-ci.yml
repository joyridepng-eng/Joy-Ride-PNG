name: Driver safety contracts
on:
  push:
    branches: [master, main, feature/driver-feedback-emergencies]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  safety-contracts:
    name: Offline Driver safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run offline Driver safety contracts
        run: node tools/verify-driver-safety.cjs

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Port_Moresby
    open-pull-requests-limit: 5
    ignore:
      # Review NestJS major upgrades as a separate migration.
      - dependency-name: '@nestjs/*'
        update-types:
          - version-update:semver-major
    groups:
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      nestjs:
        patterns:
          - '@nestjs/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Pacific/Port_Moresby
    open-pull-requests-limit: 3
